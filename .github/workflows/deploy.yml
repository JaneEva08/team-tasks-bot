# CI/CD бота: тесты → сборка Docker-образа → GitHub Container Registry → (позже) сервер.
#
# Pull request в main: тесты и пробная сборка образа, в реестр ничего не уходит.
# Push в main (в том числе слияние PR): тесты, сборка, проверка образа, пуш в ghcr.io.
# Деплой на сервер выключен, пока в Settings → Variables не задано DEPLOY_ENABLED=true.
name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Установить зависимости
        run: pip install -r requirements-dev.txt

      - name: Запустить тесты
        run: pytest -v

  build:
    name: Сборка и публикация образа
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # нужно только для пуша в ghcr.io
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      # ghcr.io принимает имена только в нижнем регистре, а владелец репозитория — JaneEva08
      - name: Имя образа и тег
        id: vars
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Метаданные образа
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/setup-buildx-action@v3

      - name: Собрать образ
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true          # оставить образ на раннере для проверки
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Проверяем, что образ вообще рабочий: код импортируется,
      # бот не под root и может писать базу в /app/data
      - name: Проверить образ
        run: |
          TAG="${IMAGE}:${{ steps.vars.outputs.sha_tag }}"
          docker run --rm -e BOT_TOKEN=123456:TEST "$TAG" python -c "
          import os, main
          from database import db
          assert os.getuid() != 0, 'бот запущен под root'
          db.add_task('проверка образа', 'ci')
          assert db.get_all_tasks()[0][1] == 'проверка образа'
          print('Образ рабочий, пользователь', os.getuid())
          "

      - name: Войти в GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Отправить образ в реестр
        if: github.event_name != 'pull_request'
        run: docker push --all-tags "$IMAGE"

  deploy:
    name: Деплой на сервер
    needs: build
    # Только после слияния в main и только когда сервер настроен
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency: deploy-production   # две выкладки одновременно не идут
    steps:
      - name: Обновить контейнер по SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}   # отдельный пользователь deploy, не root
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          envs: IMAGE_TAG
          script: |
            set -e
            cd ~/team-tasks-bot
            PREVIOUS_TAG=$(cat .current_tag 2>/dev/null || echo latest)
            export IMAGE_TAG
            docker compose pull
            docker compose up -d
            sleep 15
            if [ "$(docker inspect -f '{{.State.Running}}' team-tasks-bot)" != "true" ]; then
              echo "Контейнер не запустился, откат на $PREVIOUS_TAG"
              docker compose logs --tail 50
              IMAGE_TAG=$PREVIOUS_TAG docker compose up -d
              exit 1
            fi
            echo "$IMAGE_TAG" > .current_tag
            docker image prune -f
            echo "Выложена версия $IMAGE_TAG"
